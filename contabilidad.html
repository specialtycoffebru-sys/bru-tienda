function lsGet(k, d){ try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
function hash(s){ var h = 5381; s = String(s); for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
function norm(s){ return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim(); }
function num(v){ if (typeof v === 'number') return v; var s = String(v || '').replace(/\$/g, '').trim(); if (/,\d{1,2}$/.test(s)) s = s.replace(/\./g, '').replace(',', '.'); else s = s.replace(/[.,](?=\d{3}(\D|$))/g, ''); return Number(s) || 0; }

function csv(filas){ return filas.map(function(r){ return r.map(function(v){ v = v == null ? '' : String(v); return /[",;\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(';'); }).join('\n'); }

// Dígito de verificación del NIT (algoritmo DIAN)
function calcDV(nit){
  var d = String(nit || '').replace(/\D/g, ''); if (!d) return '';
  var w = [3,7,13,17,19,23,29,37,41,43,47,53,59,67,71], s = 0;
  for (var i = 0; i < d.length && i < w.length; i++) s += Number(d.charAt(d.length - 1 - i)) * w[i];
  var r = s % 11; return String(r > 1 ? 11 - r : r);
}

// =============== DATOS (Supabase o local) ===============
function sb(path, opts){
  opts = opts || {};
  var h = { 'apikey': SB_KEY, 'Content-Type': 'application/json' };
  if (opts.prefer) h.Prefer = opts.prefer;
  if (opts.range) { h['Range-Unit'] = 'items'; h.Range = opts.range; }
  return fetch(SB_URL + '/rest/v1/' + path, { method: opts.method || 'GET', headers: h, body: opts.body ? JSON.stringify(opts.body) : undefined })
    .then(function(r){
      if (!r.ok) return r.text().then(function(t){ var e = new Error('Supabase ' + r.status + ': ' + t.slice(0, 160)); e.status = r.status; e.body = t; throw e; });
      if (r.status === 204) return null;
      return r.text().then(function(t){ return t ? JSON.parse(t) : null; });
    });
}
function cargar(){
  return sb(T + '?select=id&limit=1').then(function(){
    S.modo = 'nube';
    var all = [], from = 0, step = 1000;
    function next(){
      return sb(T + '?select=id,tipo,fecha,data,created_at&order=created_at.asc', {range: from + '-' + (from + step - 1)}).then(function(rows){
        all = all.concat(rows || []);
        if (rows && rows.length === step) { from += step; return next(); }
        return all;
      });
    }
    return next();
  }).catch(function(e){ S.modo = 'local'; S.errNube = (e.status === 404 || /42P01|schema cache|does not exist/i.test(e.body || '')) ? '' : e.message; return lsGet(LS_DATA, []); })
  .then(function(rows){
    S.docs = rows || []; S.byId = {};
    S.docs.forEach(function(d){ if (!d.data) d.data = {}; S.byId[d.id] = d; });
    var c = S.byId.cfg;
    S.cfg = mergeCfg(c ? c.data : {});
    if (!c) guardarCfg();
  });
}
function mergeCfg(c){
  var o = copia(DEF_CFG);
  Object.keys(c || {}).forEach(function(k){
    if (c[k] && typeof c[k] === 'object' && !Array.isArray(c[k]) && o[k] && typeof o[k] === 'object' && !Array.isArray(o[k])) { for (var j in c[k]) o[k][j] = c[k][j]; }
    else if (c[k] != null) o[k] = c[k];
  });
  if (!o.plan || !o.plan.length) o.plan = PUC.map(function(x){ return {c:x[0], n:x[1]}; });
  else { var tiene = {}; o.plan.forEach(function(x){ tiene[x.c] = 1; }); PUC.forEach(function(x){ if (!tiene[x[0]]) o.plan.push({c:x[0], n:x[1]}); }); }
  o.plan.sort(function(a, b){ return a.c < b.c ? -1 : 1; });
  return o;
}
function guardar(doc){
  doc.data = doc.data || {};
  if (!S.byId[doc.id]) { S.docs.push(doc); S.byId[doc.id] = doc; doc.created_at = doc.created_at || new Date().toISOString(); }
  var fila = { id: doc.id, tipo: doc.tipo, fecha: doc.fecha || null, data: doc.data };
  if (S.modo !== 'nube') { lsSet(LS_DATA, S.docs); return Promise.resolve(doc); }
  return sb(T + '?on_conflict=id', { method: 'POST', prefer: 'resolution=merge-duplicates,return=minimal', body: [fila] }).then(function(){ return doc; })
    .catch(function(e){ toast('No se guardó en la nube: ' + e.message, true); throw e; });
}
function guardarCfg(){ var d = S.byId.cfg || {id:'cfg', tipo:'cfg'}; d.data = S.cfg; return guardar(d); }
function lista(tipo){ return S.docs.filter(function(d){ return d.tipo === tipo; }); }

function nomCta(c){ var x = cuenta(c); if (x) return x.n; for (var l = c.length - 2; l >= 1; l -= 2) { x = cuenta(c.slice(0, l)); if (x) return x.n + ' (' + c + ')'; } return 'Cuenta ' + c; }
function naturaleza(c){ var k = String(c).charAt(0); return (k === '1' || k === '5' || k === '6' || k === '7') ? 1 : -1; }
function cuentasAux(){ return S.cfg.plan.filter(function(x){ return x.c.length >= 6; }); }

var COMP = { FV:'Factura de venta', NC:'Nota crédito', RC:'Recibo de caja', FC:'Factura de compra', DS:'Documento soporte', CE:'Comprobante de egreso', NOM:'Nómina', AJ:'Ajuste', AP:'Apertura', CI:'Cierre', DEP:'Depreciación', IMP:'Impuestos' };
function asientos(incluirAnulados){ return lista('asiento').filter(function(a){ return incluirAnulados || !a.data.anulado; }); }
function nuevoAsiento(comp, fecha, desc, lineas, origen, extra){
  var L = lineas.filter(function(l){ return l && l.c && (r2(l.d) || r2(l.h)); }).map(function(l){ return {c: String(l.c), t: l.t || null, d: r2(l.d), h: r2(l.h), b: l.b ? r2(l.b) : undefined, n: l.n || undefined}; });
  var td = 0, th = 0; L.forEach(function(l){ td += l.d; th += l.h; });
  td = r2(td); th = r2(th);
  if (!L.length) return Promise.reject(new Error('El asiento no tiene valores'));
  if (Math.abs(td - th) > 0.5) return Promise.reject(new Error('El asiento no cuadra: débitos ' + fmt(td) + ' y créditos ' + fmt(th)));
  if (Math.abs(td - th) > 0) { var ult = L[L.length - 1]; if (td > th) ult.h = r2(ult.h + td - th); else ult.d = r2(ult.d + th - td); }
  S.cfg.num.comp[comp] = (S.cfg.num.comp[comp] || 0) + 1;
  var doc = { id: uid('as'), tipo: 'asiento', fecha: fecha, data: { comp: comp, num: S.cfg.num.comp[comp], desc: desc, lineas: L, origen: origen || null, anulado: false, creado: new Date().toISOString() } };
  if (extra) for (var k in extra) doc.data[k] = extra[k];
  return guardarCfg().then(function(){ return guardar(doc); });
}
function anularAsiento(id, motivo){
  var a = S.byId[id]; if (!a) return Promise.resolve();
  a.data.anulado = true; a.data.anuladoEl = new Date().toISOString(); a.data.motivo = motivo || '';
  return guardar(a);
}
function origenesContabilizados(){ var o = {}; asientos().forEach(function(a){ if (a.data.origen) o[a.data.origen] = a.id; }); return o; }
// recorre las líneas de los asientos vigentes en un rango
function movs(desde, hasta, fn){
  asientos().forEach(function(a){
    if (desde && a.fecha < desde) return; if (hasta && a.fecha > hasta) return;
    a.data.lineas.forEach(function(l){ fn(l, a); });
  });
}
function saldo(prefijos, desde, hasta, tercero){
  if (typeof prefijos === 'string') prefijos = [prefijos];
  var s = 0;
  movs(desde, hasta, function(l){ if (tercero && l.t !== tercero) return; if (prefijos.some(function(p){ return l.c.indexOf(p) === 0; })) s += l.d - l.h; });
  return r2(s);
}
// saldo con el signo natural de la cuenta (positivo = normal)
function saldoN(prefijo, desde, hasta){ return r2(saldo(prefijo, desde, hasta) * naturaleza(prefijo)); }
function utilidad(desde, hasta){ return r2(-saldo(['4','5','6','7'], desde, hasta)); }

// =============== RETENCIONES ===============
function paramRet(k){ return (S.cfg.params.ret || RET_DEF).filter(function(x){ return x.k === k; })[0] || RET_DEF[RET_DEF.length - 1]; }
function calcRet(k, base, prov){
  var p = paramRet(k), e = S.cfg.empresa;
  var out = {valor:0, tasa:0, cta:p.cta, motivo:''};
  if (!p.cta || !(p.t1 || p.t2)) { out.motivo = 'Sin retención'; return out; }
  if (!e.agenteRet) { out.motivo = 'La empresa no es agente de retención'; return out; }
  if (prov && prov.autorretenedor) { out.motivo = 'El proveedor es autorretenedor'; return out; }
  var tope = (p.base || 0) * S.cfg.params.uvt;
  if (base < tope) { out.motivo = 'No supera la base de ' + p.base + ' UVT (' + fmt(tope) + ')'; return out; }
  out.tasa = p.crit === 'persona' ? (prov && prov.persona === 'J' ? p.t1 : p.t2) : (prov && prov.declarante ? p.t1 : p.t2);
  out.valor = r0(base * out.tasa / 100);
  return out;
}

// =============== FACTURACIÓN ===============
function facturas(){ return lista('factura').sort(function(a, b){ return (b.fecha || '').localeCompare(a.fecha || '') || (b.data.n || 0) - (a.data.n || 0); }); }
function totalesFac(items){
  var sub = 0, iva = 0, porTasa = {};
  items.forEach(function(it){
    var bruto = (Number(it.cant) || 0) * (Number(it.precio) || 0);
    var neto = bruto * (1 - (Number(it.desc) || 0) / 100);
    var v = neto * (Number(it.iva) || 0) / 100;
    sub += neto; iva += v; porTasa[it.iva] = (porTasa[it.iva] || 0) + v;
  });
  return {sub: r2(sub), iva: r2(iva), total: r2(sub + iva), porTasa: porTasa};
}
function pagadoDe(d){ return r2((d.data.pagos || []).reduce(function(s, p){ return s + (Number(p.valor) || 0) + (Number(p.retFte) || 0) + (Number(p.retIVA) || 0) + (Number(p.retICA) || 0); }, 0)); }
function saldoFac(d){ if (d.data.estado === 'anulada' || d.data.estado === 'borrador') return 0; var t = d.data.total - (d.data.ncTotal || 0); return d.data.forma === 'credito' ? r2(t - pagadoDe(d)) : 0; }
function estFac(d){
  var x = d.data;
  if (x.estado === 'anulada') return '<span class="st bad">Anulada</span>';
  if (x.estado === 'borrador') return '<span class="st">Borrador</span>';
  if (!x.cufe) return '<span class="st warn">Sin validar en la DIAN</span>';
  return '<span class="st ok">Validada DIAN</span>';
}

  var porCobrar = L.reduce(function(s, d){ return s + saldoFac(d); }, 0);
  var sinCufe = L.filter(function(d){ return d.data.estado === 'contabilizada' && !d.data.cufe; }).length;
  var n = S.cfg.num.FV, prov = S.cfg.fe.proveedor;
  $('t-facturas').innerHTML =

function calcIVA(desde, hasta){

function renderAnalisis(){
  var h = hoy(), m0 = mesDe(h), meses = [];
  for (var i = 3; i >= 1; i--) { var d = new Date(m0 + '-15T12:00:00'); d.setMonth(d.getMonth() - i); meses.push(d.toISOString().slice(0, 7)); }
  var desde = meses[0] + '-01', hasta = finMes(meses[2]);
  var R = resultados(desde, hasta), vari = S.cfg.variables || [];
  var gVar = 0, gFij = 0;
  movs(desde, hasta, function(l){ if (!/^5[123]/.test(l.c)) return; var v = l.d - l.h; if (vari.some(function(p){ return l.c.indexOf(p) === 0; })) gVar += v; else gFij += v; });
  var ventas = R.I / 3, cv = (R.C + gVar) / 3, cf = gFij / 3, mc = ventas ? (ventas - cv) / ventas : 0, pe = mc > 0 ? cf / mc : 0;
  var sim = S.peSim || {cf: r0(cf) || 6000000, precio: 45000, costo: 22000};
  var mU = sim.precio - sim.costo, peU = mU > 0 ? Math.ceil(sim.cf / mU) : 0;
  // flujo de caja 13 semanas

  for (var s = 0; s < 13; s++) semanas.push({ini: sumaDias(h, s * 7), fin: sumaDias(h, s * 7 + 6), ent: 0, sal: 0});
  facturas().forEach(function(f){ var sd = saldoFac(f); if (sd > 0) { var w = Math.max(0, Math.floor(difDias(h, f.data.vence || h) / 7)); if (w < 13) semanas[w].ent += sd; } });
  compras().forEach(function(c){ var sd = saldoCompra(c); if (sd > 0) { var w = Math.max(0, Math.floor(difDias(h, c.data.vence || h) / 7)); if (w < 13) semanas[w].sal += sd; } });
  var nomUlt = lista('nomina').filter(function(n){ return !n.data.anulada; }).sort(function(a, b){ return b.data.mes.localeCompare(a.data.mes); })[0];
  var nomVal = nomUlt ? Object.keys(nomUlt.data.det || {}).reduce(function(t, k){ var l = nomUlt.data.det[k]; return t + l.neto + l.saludE + l.pensE + l.fsp + l.emp.salud + l.emp.pension + l.emp.arl + l.emp.caja + l.emp.icbf + l.emp.sena; }, 0) : 0;
  semanas.forEach(function(w){ if (nomVal && w.ini.slice(0, 7) !== w.fin.slice(0, 7)) w.sal += nomVal; });
  var run = caja;
  $('t-analisis').innerHTML = '<div class="grid g2"><div class="card"><h3>Punto de equilibrio con tus números</h3><div class="small muted" style="margin-bottom:8px">Promedio de ' + nomMes(meses[0]) + ' a ' + nomMes(meses[2]) + '. Gastos variables: ' + vari.map(function(c){ return esc(nomCta(c)); }).join(', ') + ' (cámbialos en Configuración).</div>' +
    '<table class="t"><tbody><tr><td>Ventas promedio al mes</td><td class="num">' + fmt(ventas) + '</td></tr><tr><td>Costos y gastos variables al mes</td><td class="num">' + fmt(cv) + '</td></tr><tr><td>Margen de contribución</td><td class="num">' + (mc * 100).toFixed(1) + ' %</td></tr><tr><td>Costos fijos al mes</td><td class="num">' + fmt(cf) + '</td></tr><tr class="tot"><td>Ventas mínimas para no perder</td><td class="num">' + (pe ? fmt(pe) : '—') + '</td></tr><tr><td>Estás ' + (ventas >= pe ? 'por encima' : 'por debajo') + ' del equilibrio en</td><td class="num" style="color:' + (ventas >= pe ? 'var(--ok)' : 'var(--bad)') + '">' + (pe ? fmt(ventas - pe) : '—') + '</td></tr></tbody></table>' +
    (pe ? '<div class="bar" style="margin-top:10px;height:12px" title="Ventas vs equilibrio"><i style="width:' + Math.min(100, Math.round(ventas * 100 / Math.max(pe, ventas, 1))) + '%"></i></div><div class="small muted" style="margin-top:4px">Barra: ventas promedio frente al ' + (ventas >= pe ? 'total (el equilibrio queda en ' + Math.round(pe * 100 / ventas) + ' %)' : 'equilibrio') + '</div>' : '') + '</div>' +
    '<div class="card"><h3>Simulador por bolsa</h3><div class="grid g3">' + fld('Costos fijos del mes', inp('psCF', sim.cf, 'number')) + fld('Precio de la bolsa sin IVA', inp('psP', sim.precio, 'number')) + fld('Costo variable por bolsa', inp('psC', sim.costo, 'number')) + '</div>' +
    '<div style="margin-top:12px;font-size:15px">Cada bolsa deja <b>' + fmt(mU) + '</b>. Necesitas vender <b style="font-size:20px">' + peU + ' bolsas al mes</b> (' + fmt(peU * sim.precio) + ' en ventas) para cubrir los costos fijos.</div><div class="small muted" style="margin-top:6px">Costo variable = café verde con merma de tueste + empaque + etiqueta + envío.</div></div></div>' +
    '<div class="card" style="margin-top:12px"><h3>Flujo de caja proyectado · 13 semanas</h3><div class="small muted" style="margin-bottom:8px">Parte del saldo actual en caja y bancos (' + fmt(caja) + '), suma lo que te deben según el vencimiento de cada factura y resta lo que debes a proveedores' + (nomVal ? ' y la nómina de cada fin de mes (' + fmt(nomVal) + ')' : '') + '.</div><div class="tbl-w"><table class="t"><thead><tr><th>Semana</th><th class="num">Entradas</th><th class="num">Salidas</th><th class="num">Saldo final</th></tr></thead><tbody>' +
    semanas.map(function(w){ run += w.ent - w.sal; return '<tr><td>' + fFecha(w.ini) + ' – ' + fFecha(w.fin) + '</td><td class="num">' + fmtN(w.ent) + '</td><td class="num">' + fmtN(w.sal) + '</td><td class="num" style="color:' + (run < 0 ? 'var(--bad)' : '') + '"><b>' + fmt(run) + '</b></td></tr>'; }).join('') + '</tbody></table></div></div>';

      p.ret.map(function(r, i){ return '<tr><td>' + esc(r.n) + '</td><td><input type="number" step="0.01" data-r="' + i + ':base" value="' + r.base + '" style="width:80px"></td><td class="num small muted">' + fmt(r.base * p.uvt) + '</td><td><input type="number" step="0.01" data-r="' + i + ':t1" value="' + r.t1 + '" style="width:80px"></td><td><input type="number" step="0.01" data-r="' + i + ':t2" value="' + r.t2 + '" style="width:80px"></td><td><select data-r="' + i + ':cta">' + '<option value="">—</option>' + optCtas(r.cta, ['236']) + '</select></td></tr>'; }).join('') +
      '</tbody></table></div><div class="row" style="margin-top:10px"><button class="btn ghost" id="crDef">Restaurar valores de ley</button><span class="sp"></span><button class="btn pri" id="crOk">Guardar</button></div>';

  if (st.cur === 'num') {

      '<h3 style="margin-top:16px">Documento soporte (compras a no facturadores)</h3><div class="grid g3">' + fld('Prefijo', inp('cnDp', n.DS.prefijo)) + fld('Resolución DIAN', inp('cnDr', n.DS.resol)) + fld('Fecha de la resolución', inp('cnDf', n.DS.fecha, 'date')) +
      fld('Desde', inp('cnDd', n.DS.desde, 'number')) + fld('Hasta', inp('cnDh', n.DS.hasta, 'number')) + fld('Siguiente número', inp('cnDs', n.DS.sig, 'number')) + '</div>' +
      '<div class="row" style="margin-top:12px"><span class="small muted sp">Los números deben coincidir con la resolución que te dio la DIAN y con tu proveedor de facturación.</span><button class="btn pri" id="cnOk">Guardar</button></div></div>';
    $('cnOk').onclick = function(){
      n.FV.prefijo = val('cnFp'); n.FV.resol = val('cnFr'); n.FV.fecha = val('cnFf'); n.FV.desde = Number(val('cnFd')) || 1; n.FV.hasta = Number(val('cnFh')) || 0; n.FV.vence = val('cnFv'); n.FV.sig = Number(val('cnFs')) || 1;

      n.DS.prefijo = val('cnDp'); n.DS.resol = val('cnDr'); n.DS.fecha = val('cnDf'); n.DS.desde = Number(val('cnDd')) || 1; n.DS.hasta = Number(val('cnDh')) || 0; n.DS.sig = Number(val('cnDs')) || 1;
      ok('Numeración guardada');

  }
  if (st.cur === 'fe') {
    var fe = S.cfg.fe;
    c.innerHTML = '<div class="card"><div class="grid g2">' + fld('Cómo se emiten las facturas', sel('cfP', [['manual','Manual: las emito en la DIAN gratuita o en otro programa y pego el CUFE'],['alegra','Automático con Alegra (se envían solas a la DIAN)']], fe.proveedor)) +
      fld('Clave de acceso al servidor (opcional)', '<input type="password" id="cfTok" value="' + esc(lsGet(LS_TOK, '')) + '" placeholder="Solo si configuraste CONTA_TOKEN en Vercel">') + '</div>' +
      '<div class="banner info" style="margin-top:12px"><b>Para emitir automático con Alegra:</b><ol style="margin:6px 0 0;padding-left:18px;line-height:1.8"><li>Crea la cuenta en alegra.com, habilítate como facturador electrónico con la DIAN y asocia tu resolución de numeración.</li><li>En Alegra: Configuración → Integraciones → API, copia tu correo y el token.</li><li>En Vercel → Settings → Environment Variables agrega <code>ALEGRA_EMAIL</code> y <code>ALEGRA_TOKEN</code> (y si quieres, <code>ALEGRA_NUMERACION</code> con el id de la numeración). Redeploy.</li><li>Elige «Automático con Alegra» aquí y pulsa «Probar conexión».</li></ol></div>' +
      '<div class="row" style="margin-top:12px"><button class="btn" id="cfTest">Probar conexión</button><span id="cfRes" class="small muted"></span><span class="sp"></span><button class="btn pri" id="cfOk">Guardar</button></div></div>';
    $('cfOk').onclick = function(){ fe.proveedor = val('cfP'); lsSet(LS_TOK, val('cfTok')); ok(); };
    $('cfTest').onclick = function(){ lsSet(LS_TOK, val('cfTok')); $('cfRes').textContent = 'Probando…'; api('alegra_test').then(function(r){ S.svc.alegra = !r.error; $('cfRes').textContent = r.error ? '✕ ' + r.error : '✓ Conectado a Alegra · ' + (r.empresa || '') ; renderEstado(); }); };

  if (st.cur === 'bancos') {
    c.innerHTML = '<div class="card"><div class="small muted" style="margin-bottom:8px">Cada cuenta bancaria es una subcuenta de 1110. La primera es la que se usa por defecto para pagos y cobros por banco.</div>' +
      '<div class="tbl-w"><table class="t"><thead><tr><th>Cuenta contable</th><th>Nombre (banco y número)</th><th></th></tr></thead><tbody>' +
      S.cfg.bancos.map(function(b, i){ return '<tr><td>' + b.cta + '</td><td>' + esc(b.nombre) + '</td><td class="num">' + (i ? '<button class="btn sm ghost" data-bp="' + i + '">Hacer principal</button>' : '<span class="st ok">Principal</span>') + '</td></tr>'; }).join('') + '</tbody></table></div>' +
      '<div class="row" style="margin-top:10px"><input type="text" id="cbN" placeholder="Ej. Bancolombia ahorros 1234" style="flex:1;min-width:220px"><button class="btn" id="cbAdd">Agregar cuenta</button></div></div>';
    $('cbAdd').onclick = function(){ var nm = val('cbN').trim(); if (!nm) return toast('Escribe el nombre', true);
      var k = 5, cta = '';
      do { cta = '1110' + ('0' + k).slice(-2); k += 5; } while (k < 100 && S.cfg.bancos.some(function(b){ return b.cta === cta; }));

      if (!cuenta(cta)) S.cfg.plan.push({c: cta, n: nm}); else cuenta(cta).n = nm;

      S.cfg.bancos.push({cta: cta, nombre: nm}); ok('Cuenta agregada'); };
    c.onclick = function(ev){ var b = ev.target.closest('[data-bp]'); if (!b) return; var i = Number(b.getAttribute('data-bp')), x = S.cfg.bancos.splice(i, 1)[0]; S.cfg.bancos.unshift(x); ok(); };
  }
  if (st.cur === 'map') {
    var m = S.cfg.map, cats = Object.keys(m.gas);

      cats.map(function(k, i){ return fld(k, '<select data-mg="' + esc(k) + '"><option value="skip"' + (m.gas[k] === 'skip' ? ' selected' : '') + '>No contabilizar</option>' + optCtas(m.gas[k], ['14','15','5','6']) + '</select>'); }).join('') +

// =============== ARRANQUE ===============
document.addEventListener('click', function(ev){
  var g = ev.target.closest('[data-go]'); if (!g) return; ev.preventDefault();
  var sub = g.getAttribute('data-sub'), t = g.getAttribute('data-go'); if (sub) S.sub[t] = sub; ir(t);
});
$('tabs').onclick = function(ev){ var b = ev.target.closest('button[data-t]'); if (b) ir(b.getAttribute('data-t')); };
$('ov').onclick = cerrarPanel;
document.addEventListener('keydown', function(ev){ if (ev.key === 'Escape') cerrarPanel(); });
(function boot(){
  $('t-resumen').innerHTML = '<div class="empty">Cargando contabilidad…</div>';
  var t0 = lsGet('bru_conta_tab', 'resumen'); if (RENDER[t0]) S.tab = t0;
  var mt = /[?&]tab=([a-z]+)/.exec(location.search); if (mt && RENDER[mt[1]]) S.tab = mt[1];
  cargar().then(function(){
    if (S.modo === 'nube' && !lsGet('bru_conta_local_subido', '')) {
      var loc = lsGet(LS_DATA, []); S.pendLocal = (loc || []).filter(function(d){ return d && d.id && d.id !== 'cfg' && !S.byId[d.id]; });
      if (S.pendLocal.length) { var lc = loc.filter(function(d){ return d.id === 'cfg'; })[0]; if (lc) S.pendLocal.push(lc); }
    }
    return asegurarCF();
  }).then(function(){
    renderBanners(); render();
    api('ping').then(function(r){ S.svc = r && !r.error ? r : {}; renderEstado(); });
  }).catch(function(e){ console.error(e); $('t-resumen').innerHTML = '<div class="banner bad">No se pudo cargar: ' + esc(e.message) + '</div>'; });
})();

})();
