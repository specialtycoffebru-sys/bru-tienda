function extra(id){ return S.cfg.extras.filter(function(e){ return e.id === id; })[0]; }

  var cc = costoClase(clase), n = Math.max(1, personas || 1);

  var mult = clase.extrasPorPersona ? n : 1;

}

      var L = S.cfg.combos[k.id] || (S.cfg.combos[k.id] = []);
      return '<div class="card" style="margin-bottom:12px"><div class="row"><h3 style="flex:1">' + esc(k.corto || k.nombre) + '</h3><button class="btn sm" data-addc="' + k.id + '">+ Combo</button></div>' +
        '<div class="tbl-w" style="margin-top:8px"><table class="t"><thead><tr><th>Combo</th><th>Incluye</th><th class="num">Precio (' + (k.extrasPorPersona ? Math.max(1, k.minPersonas || 1) + ' personas, extras por persona' : '1 persona') + ')</th><th class="num">Costo</th><th class="num">Ganancia</th><th class="num">Margen</th><th></th></tr></thead><tbody>' +
        L.map(function(cb, j){ var t = totalCombo(k, cb.items, k.extrasPorPersona ? Math.max(1, k.minPersonas || 1) : 1);
          return '<tr><td style="min-width:150px"><input type="text" data-cn="' + k.id + '|' + j + '" value="' + esc(cb.nombre) + '"></td><td style="min-width:260px">' + cb.items.map(function(it){ var e = extra(it.id); if (!e) return '';
              return '<span class="chipq on">' + esc(e.nombre) + ' <button data-q="' + k.id + '|' + j + '|' + e.id + '|-1">−</button><b>' + it.qty + '</b><button data-q="' + k.id + '|' + j + '|' + e.id + '|1">+</button></span>'; }).join('') + (cb.items.length ? '' : '<span class="small muted">Solo la clase </span>') +
              '<select data-add="' + k.id + '|' + j + '" style="width:auto;padding:3px 6px;font-size:12px;margin:2px"><option value="">+ agregar…</option>' + S.cfg.extras.filter(function(e){ return e.activo !== false && !cb.items.some(function(x){ return x.id === e.id; }); }).map(function(e){ return '<option value="' + e.id + '">' + esc(e.nombre) + '</option>'; }).join('') + '</select></td>' +
            '<td class="num"><b>' + fmt(t.total) + '</b>' + (t.descuento ? '<div class="small muted">incluye −' + fmt(t.descuento) + '</div>' : '') + '</td><td class="num">' + fmt(t.costo) + '</td><td class="num">' + fmt(t.ganancia) + '</td><td class="num"><span class="st ' + (t.margen < 30 ? 'bad' : 'ok') + '">' + pct(t.margen) + '</span></td><td><button class="btn sm ghost" data-delc="' + k.id + '|' + j + '">✕</button></td></tr>'; }).join('') +
        '</tbody></table></div></div>'; }).join('');
  c.onclick = function(e){
    var q = e.target.closest('[data-q]'), a = e.target.closest('[data-addc]'), dl = e.target.closest('[data-delc]');
    if (q) { var p = q.getAttribute('data-q').split('|'), cb = S.cfg.combos[p[0]][Number(p[1])], it = cb.items.filter(function(x){ return x.id === p[2]; })[0]; if (!it) { it = { id: p[2], qty: 0 }; cb.items.push(it); } it.qty = Math.max(0, Math.min(9, it.qty + Number(p[3]))); cb.items = cb.items.filter(function(x){ return x.qty > 0; }); guardarLuego(); render(); }
    if (a) { S.cfg.combos[a.getAttribute('data-addc')].push({ nombre: 'Nuevo combo', items: [] }); guardarLuego(); render(); }
    if (dl) { var p2 = dl.getAttribute('data-delc').split('|'); S.cfg.combos[p2[0]].splice(Number(p2[1]), 1); guardarLuego(); render(); }
  };
  c.onchange = function(e){ var a = e.target.getAttribute('data-add'); if (!a || !e.target.value) return; var p = a.split('|'); S.cfg.combos[p[0]][Number(p[1])].items.push({ id: e.target.value, qty: 1 }); guardarLuego(); render(); };
  c.oninput = function(e){ var n = e.target.getAttribute('data-cn'); if (!n) return; var p = n.split('|'); S.cfg.combos[p[0]][Number(p[1])].nombre = e.target.value; guardarLuego(); };
}

// =============== AGENDA ===============
var MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'], DIAS = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'], DIASL = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
function agCfg(){ var a = S.cfg.agenda || (S.cfg.agenda = copia(DEF.agenda)); Object.keys(DEF.agenda).forEach(function(k){ if (a[k] == null) a[k] = copia(DEF.agenda[k]); }); return a; }
function ymd(d){ return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function horaMin(h){ var m = /(\d{1,2})(?::(\d{2}))?\s*([ap])?/i.exec(h || '') || [0, 0, 0, '']; var hh = Number(m[1]) % 12; if ((m[3] || '').toLowerCase() === 'p') hh += 12; else if (!m[3] && Number(m[1]) === 12) hh = 12; return hh * 60 + Number(m[2] || 0); }
function slotsDia(f){ var A = agCfg(), d = new Date(f + 'T12:00:00'), L = A.dias.indexOf(d.getDay()) >= 0 ? A.horarios.slice() : [];
  A.extra.forEach(function(x){ var p = x.split('|'); if (p[0] === f && L.indexOf(p[1]) < 0) L.push(p[1]); });
  return L.sort(function(a, b){ return horaMin(a) - horaMin(b); }); }
function slotLargo(k){ var p = String(k).split('|'), d = new Date(p[0] + 'T12:00:00'); return DIASL[d.getDay()] + ' ' + d.getDate() + ' ' + MESES[d.getMonth()] + (p[1] ? ' · ' + p[1] : ''); }
function ocupados(){ var o = {}; S.res.forEach(function(r){ var x = r.data || {}; if (x.slot && x.estado !== 'cancelada') o[x.slot] = r; }); return o; }
function toggle(arr, v){ var i = arr.indexOf(v); if (i >= 0) arr.splice(i, 1); else arr.push(v); }
function renderAgenda(c){
  var A = agCfg();
  c.innerHTML = '<div class="card" style="margin-bottom:12px"><div class="small muted" style="margin-bottom:10px">La página de clases muestra un calendario con estos cupos. Cuando alguien reserva, esa hora queda ocupada para los demás. Si cancelas la reserva, la hora se libera.</div>' +
    '<div class="grid g3"><label class="f">Horas de clase (separadas por coma)<input type="text" id="agH" value="' + esc(A.horarios.join(', ')) + '" placeholder="9:00 a.m., 2:00 p.m."></label>' + campo('Semanas que se muestran', 'agenda.semanas', A.semanas) + campo('Días de anticipación mínima', 'agenda.anticipacion', A.anticipacion) + '</div>' +
    '<div class="small muted" style="margin:12px 0 6px">Días que se abren cada semana:</div><div class="row">' + [1, 2, 3, 4, 5, 6, 0].map(function(d){ return '<label class="chipq' + (A.dias.indexOf(d) >= 0 ? ' on' : '') + '" style="padding:5px 12px;cursor:pointer"><input type="checkbox" data-dsem="' + d + '"' + (A.dias.indexOf(d) >= 0 ? ' checked' : '') + ' style="display:none">' + DIASL[d] + '</label>'; }).join('') + '</div></div>' +
    '<div class="row" style="margin-bottom:8px"><span class="small muted">Toca una hora para bloquearla o liberarla. En un día cerrado, “+ Abrir” lo habilita con tus horas.</span><span class="sp"></span><a class="btn sm" href="/clases.html" target="_blank">Ver en la web ↗</a></div><div id="agCal"></div>';
  pintarCal();
  c.oninput = function(e){ var el = e.target;
    if (el.id === 'agH') { A.horarios = el.value.split(',').map(function(x){ return x.trim(); }).filter(Boolean); guardarLuego(); pintarCal(); return; }
    if (el.getAttribute('data-dsem') != null) { toggle(A.dias, Number(el.getAttribute('data-dsem'))); guardarLuego(); renderAgenda(c); return; }
    if (el.getAttribute('data-p')) { setPath(el.getAttribute('data-p'), num(el.value)); guardarLuego(); pintarCal(); } };
  c.onchange = null;
  c.onclick = function(e){ var b = e.target.closest('[data-ag]'); if (!b) return; var p = b.getAttribute('data-ag').split('~'), act = p[0], f = p[1], h = p[2];
    if (act === 'slot') toggle(A.bloq, f + '|' + h);
    if (act === 'cerrar') toggle(A.bloq, f);
    if (act === 'abrir') { A.horarios.forEach(function(x){ if (A.extra.indexOf(f + '|' + x) < 0) A.extra.push(f + '|' + x); }); A.bloq = A.bloq.filter(function(x){ return x !== f && x.indexOf(f + '|') !== 0; }); }
    if (act === 'quitar') A.extra = A.extra.filter(function(x){ return x.indexOf(f + '|') !== 0; });
    if (act === 'hora') { var n = prompt('Hora extra para el ' + slotLargo(f) + ' (ej. 4:00 p.m.)'); if (!n || !n.trim()) return; if (A.extra.indexOf(f + '|' + n.trim()) < 0) A.extra.push(f + '|' + n.trim()); }
    if (act === 'res') { S.tab = 'reservas'; render(); return; }
    guardarLuego(); pintarCal(); };
}
function pintarCal(){
  var A = agCfg(), box = $('agCal'); if (!box) return; var O = ocupados(), hoyD = new Date(); hoyD.setHours(12, 0, 0, 0);
  var ini = new Date(hoyD); ini.setDate(ini.getDate() - ((ini.getDay() + 6) % 7)); var fin = new Date(hoyD); fin.setDate(fin.getDate() + (A.semanas || 8) * 7);
  var lim = new Date(hoyD); lim.setDate(lim.getDate() + (A.anticipacion || 0));
  var h = '<div class="agn-g">' + [1, 2, 3, 4, 5, 6, 0].map(function(d){ return '<div class="agn-dw">' + DIAS[d] + '</div>'; }).join('');
  for (var d = new Date(ini); d <= fin; d.setDate(d.getDate() + 1)) {
    var f = ymd(d), pas = d < hoyD, L = slotsDia(f), cer = A.bloq.indexOf(f) >= 0, esExtra = A.extra.some(function(x){ return x.indexOf(f + '|') === 0; }), base = A.dias.indexOf(d.getDay()) >= 0;
    h += '<div class="agn-d' + (pas ? ' pas' : '') + (cer ? ' cer' : '') + (!L.length ? ' vac' : '') + '"><div class="agn-n"><b>' + d.getDate() + '</b> ' + MESES[d.getMonth()] + (d < lim && !pas ? ' <span class="dim" title="Dentro de la anticipación mínima: no se muestra en la web">·</span>' : '') + '</div>';
    if (!pas) {
      if (cer) h += '<div class="small muted">Cerrado</div><button class="btn sm" data-ag="cerrar~' + f + '">Reabrir</button>';
      else {
        h += L.map(function(x){ var k = f + '|' + x, r = O[k], bl = A.bloq.indexOf(k) >= 0;
          if (r) return '<button class="agn-s res" data-ag="res~' + f + '" title="' + esc((r.data.nombre || '') + ' · ' + (r.data.clase || '')) + '">' + esc(x) + '<i>' + esc(String(r.data.nombre || 'Reservado').split(' ')[0]) + '</i></button>';
          return '<button class="agn-s' + (bl ? ' bl' : '') + '" data-ag="slot~' + f + '~' + esc(x) + '">' + esc(x) + '<i>' + (bl ? 'bloqueada' : 'libre') + '</i></button>'; }).join('');
        h += '<div class="agn-a">' + (L.length ? '<button class="lnk" data-ag="hora~' + f + '">+ hora</button>' + (base ? '<button class="lnk" data-ag="cerrar~' + f + '">cerrar día</button>' : '') + (esExtra ? '<button class="lnk" data-ag="quitar~' + f + '">quitar</button>' : '') : '<button class="lnk" data-ag="abrir~' + f + '">+ Abrir</button>') + '</div>';
      }
    }
    h += '</div>';
  }
  box.innerHTML = h + '</div>';
}
var EST = [['nueva', 'Nueva'], ['confirmada', 'Confirmada'], ['pagada', 'Pagada'], ['realizada', 'Realizada'], ['cancelada', 'Cancelada']];
function renderReservas(c){
  var R = S.res;
  c.innerHTML = '<div class="row" style="margin-bottom:10px"><span class="small muted">Solicitudes que llegan desde la página de clases. Escríbele a la persona para confirmar fecha y pago.</span><span class="sp"></span><button class="btn sm" id="rRef">Actualizar</button><a class="btn sm" href="/clases.html" target="_blank">Ver página ↗</a></div>' +
    (R.length ? R.map(function(r){ var x = r.data, tel = String(x.telefono || '').replace(/\D/g, ''); if (tel.length === 10) tel = '57' + tel;
      return '<div class="card" style="margin-bottom:8px"><div class="row"><b>' + esc(x.nombre || 'Sin nombre') + '</b><span class="pill">' + esc(x.clase || '') + '</span><span class="small muted">' + fFecha(String(r.created_at || '').slice(0, 10)) + '</span><span class="sp"></span><select data-est="' + r.id + '">' + EST.map(function(s){ return '<option value="' + s[0] + '"' + ((x.estado || 'nueva') === s[0] ? ' selected' : '') + '>' + s[1] + '</option>'; }).join('') + '</select></div>' +
        '<div class="small" style="margin-top:6px">' + esc(x.personas || 1) + ' persona(s) · ' + (x.slot ? '📅 <b>' + esc(slotLargo(x.slot)) + '</b> · ' : (x.fechaPref ? 'propone ' + fFecha(x.fechaPref) + (x.horaPref ? ' ' + esc(x.horaPref) : '') + ' · ' : '')) + (x.combo ? 'combo ' + esc(x.combo) + ' · ' : '') + '<b>' + fmt(x.total) + '</b></div>' + (x.direccion ? '<div class="small" style="margin-top:4px">📍 ' + esc(x.direccion) + '</div>' : '') + (x.empresa ? '<div class="small" style="margin-top:4px">🏢 ' + esc(x.empresa) + '</div>' : '') +
        (x.items && x.items.length ? '<div class="small muted" style="margin-top:4px">' + x.items.map(function(i){ return esc(i.qty + ' × ' + i.nombre + (i.cafe ? ' (' + i.cafe + ')' : '')); }).join(' · ') + '</div>' : '') + (x.nota ? '<div class="small" style="margin-top:4px">“' + esc(x.nota) + '”</div>' : '') +
        '<div class="row" style="margin-top:8px">' + (tel ? '<a class="btn sm pri" target="_blank" rel="noopener" href="https://wa.me/' + tel + '?text=' + encodeURIComponent('Hola ' + String(x.nombre || '').split(' ')[0] + ', soy Camilo de B.R.U ☕ Recibí tu solicitud para la ' + (x.clase || 'clase') + (x.slot ? ' para el ' + slotLargo(x.slot) + '. Te confirmo la reserva y te paso los datos de pago.' : '. ¿Te queda bien ' + (x.fechaPref ? fFecha(x.fechaPref) : 'esta semana') + '?')) + '">WhatsApp ' + esc(x.telefono) + '</a>' : '') + (x.email ? '<span class="small muted">' + esc(x.email) + '</span>' : '') + '</div></div>'; }).join('') : '<div class="empty">Aún no hay reservas. Comparte la página <b>brucoffeeshop.online/clases.html</b>.</div>');
  $('rRef').onclick = function(){ sb(T + '?tipo=eq.clase_res&select=id,fecha,data,created_at&order=created_at.desc&limit=200').then(function(r){ S.res = r || []; render(); }); };
  c.onchange = function(e){ var id = e.target.getAttribute('data-est'); if (!id) return; var r = S.res.filter(function(x){ return x.id === id; })[0]; r.data.estado = e.target.value; upsert({ id: r.id, tipo: 'clase_res', fecha: r.fecha, data: r.data }).then(function(){ toast('Estado actualizado'); render(); }); };
}
function renderAjustes(c){
  var C = S.cfg;
  c.innerHTML = '<div class="card"><div class="grid g3">' + campo('Costo del café tostado por gramo', 'costoG', C.costoG) + campo('Margen objetivo (%)', 'margen', C.margen) + campo('Redondear precios a', 'redondeo', C.redondeo) +
    campo('Descuento por combo (%)', 'descuento.pct', C.descuento.pct) + campo('Desde cuántos elementos aplica', 'descuento.minExtras', C.descuento.minExtras) + campo('WhatsApp para reservas', 'wa', C.wa, 'text') + '</div>' + '<label class="f" style="margin-top:10px">Disponibilidad (sale en la web)<input type="text" data-p="disponibilidad" value="' + esc(C.disponibilidad || '') + '"></label>' +
    '<div class="small muted" style="margin-top:10px">El costo por gramo incluye café verde, merma de tostión y gas. Con un verde de unos $' + '35.000/kg y 16 % de merma, más tostión, queda alrededor de $90–110 por gramo.</div>' +
    '<div class="row" style="margin-top:12px"><button class="btn" id="aRes">Volver a los valores iniciales</button><a class="btn" href="/clases.html" target="_blank">Ver la página de clases ↗</a></div></div>';
  enlazar(c);
  $('aRes').onclick = function(){ if (!confirm('Se reemplazan todos los costos, precios y combos por los valores iniciales. ¿Seguir?')) return; S.cfg = copia(DEF); guardar().then(render); };
}

(function(){
  $('tabs').onclick = function(e){ var b = e.target.closest('button[data-t]'); if (b) { S.tab = b.getAttribute('data-t'); render(); window.scrollTo(0, 0); } };

})();

})();
