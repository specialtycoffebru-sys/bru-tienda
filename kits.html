<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,300;9..144,500&display=swap" rel="stylesheet">
<script>if(/[?&]embed=1/.test(location.search))document.documentElement.className+=' embed';</script>
<style>
:root{
  --bg:#0d0b09;--bg2:#141210;--bg3:#1c1916;--card:#181512;--card2:#1e1b17;
  --gold:#c9a84c;--gold2:#e8c96a;--gold3:rgba(201,168,76,.12);
  --txt:#e8e2d8;--mut:#a8a098;--dim:#6a6058;
  --line:rgba(255,255,255,.08);--line2:rgba(201,168,76,.28);
  --ok:#5fd394;--ok-bg:rgba(95,211,148,.1);--bad:#f38b8b;--bad-bg:rgba(243,139,139,.1);--warn:#f3a96b;--warn-bg:rgba(243,169,107,.1);--info:#7fb2f0;--info-bg:rgba(127,178,240,.1);
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
select,option,optgroup{background:var(--card2);color:var(--txt)}
a{color:var(--gold)}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:300;margin:0}
.wrap{max-width:1320px;margin:0 auto;padding:18px 16px 80px}
html.embed .wrap{padding:12px 12px 60px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.top h1{font-size:26px}
.sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:860px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.g4{grid-template-columns:1fr}}
.grid>*{min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
label.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--txt);cursor:pointer}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=search],select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none;text-transform:none;letter-spacing:0}
input:focus,select:focus,textarea:focus{border-color:var(--line2)}
textarea{min-height:64px;resize:vertical}
.btn{border:1px solid var(--line2);background:var(--card2);padding:8px 14px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:13px}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:var(--gold);color:#1a1406;border-color:var(--gold);font-weight:600}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ghost{background:transparent}
.btn.dang{color:var(--bad);border-color:rgba(243,139,139,.35)}
.btn.wa{color:var(--ok);border-color:rgba(95,211,148,.35)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--mut)}.dim{color:var(--dim)}.small{font-size:12px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl-w{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.t th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:600;background:var(--bg2)}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:rgba(255,255,255,.02)}
.st{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--card2);color:var(--mut);white-space:nowrap}
.st.ok{color:var(--ok);background:var(--ok-bg)}.st.warn{color:var(--warn);background:var(--warn-bg)}.st.bad{color:var(--bad);background:var(--bad-bg)}.st.info{color:var(--info);background:var(--info-bg)}
.banner{border-radius:var(--r);padding:10px 13px;margin-bottom:10px;font-size:13px;border:1px solid}
.banner.warn{background:var(--warn-bg);border-color:rgba(243,169,107,.35)}
.sec{margin:18px 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim)}
.empty{padding:34px 16px;text-align:center;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--gold);color:#1a1406;padding:9px 16px;border-radius:999px;font-weight:600;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;max-width:92vw;text-align:center}
.toast.on{opacity:1}.toast.err{background:var(--bad)}
/* opciones */
.opts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.opt{background:var(--card);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-width:0}
.opt.sel{border-color:var(--gold)}
.opt-hd{padding:12px 12px 8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.opt-hd .tier{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.opt-hd input.nm{font-family:Fraunces,serif;font-size:19px;font-weight:300;background:transparent;border:1px solid transparent;padding:2px 4px;margin-left:-4px}
.opt-hd input.nm:hover,.opt-hd input.nm:focus{border-color:var(--line)}
.opt-bd{padding:10px 12px;flex:1}
.it{display:grid;grid-template-columns:44px 1fr 28px;gap:6px;align-items:start;padding:7px 0;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:none}
.it input{padding:5px 7px;font-size:13px}
.it .m{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:5px}
.it .m label{font-size:10px;color:var(--dim);display:flex;flex-direction:column;gap:2px;text-transform:uppercase;letter-spacing:.05em}
.it .tag{font-size:10px;color:var(--dim);margin-top:3px}
.x{background:none;border:none;color:var(--dim);cursor:pointer;font-size:16px;padding:4px}
.x:hover{color:var(--bad)}
.opt-add{margin-top:8px}
.opt-ft{padding:10px 12px;border-top:1px solid var(--line);background:var(--bg2);border-radius:0 0 var(--r) var(--r)}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:2px 0}
.kv b{font-variant-numeric:tabular-nums;font-weight:500}
.kv.big{font-size:15px;padding-top:6px;margin-top:4px;border-top:1px solid var(--line)}
.kv.big b{color:var(--gold2);font-family:Fraunces,serif;font-size:21px;font-weight:300}
.mini{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:8px 0}
.mini label.hl{color:var(--gold2)}.mini label.hl input{border-color:var(--line2)}
.mini label{font-size:10px;color:var(--dim);display:flex;flex-direction:column;gap:3px;text-transform:uppercase;letter-spacing:.05em}
.mini input{padding:6px 8px}
.mg-ok{color:var(--ok)}.mg-warn{color:var(--warn)}.mg-bad{color:var(--bad)}
.sticky{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;margin:-8px 0 8px}
.save-st{font-size:12px;color:var(--dim)}
</style>
</head>
<body>
<div class="wrap">
  <div id="main"><div class="empty">Cargando catálogo e insumos…</div></div>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
// =============== B.R.U · COTIZADOR DE KITS ===============
// Lee catálogo (con presentaciones y costos) e insumos de bru_store SOLO LECTURA.
// Guarda cotizaciones en bru_conta con tipo 'kit_cot' + copia local de respaldo. Nunca borra: archiva.
var SB_URL = 'https://dzgtyazvqpdmwvwqpvco.supabase.co';
var SB_KEY = 'sb_publishable_oWYjmVo0OBg5XbV4BDaSWQ_hOWH6czB';
var T = 'bru_conta', TIPO = 'kit_cot', LS_BK = 'bru_kitcot_bk';
var IVA = 0.19, WA_BRU = '573044927790';
var TIERS = ['Económico', 'Intermedio', 'Premium', 'Opción 4'];
var ESTADOS = ['Borrador', 'Enviada', 'Aprobada', 'Rechazada'];
var EQ_CATS = ['Método', 'Molino', 'Accesorio', 'Filtros', 'Taza / vaso', 'Otro'];
var EQ_DEF = [['Dripper V60 02 (plástico)','Método'],['Dripper V60 02 (cerámica)','Método'],['Chemex 6 tazas','Método'],['Prensa francesa 350 ml','Método'],['AeroPress','Método'],['Cafetera moka 3 tazas','Método'],['Cold brew (jarra)','Método'],
  ['Molino manual','Molino'],['Filtros V60 x40','Filtros'],['Filtros Chemex x100','Filtros'],['Tetera cuello de cisne','Accesorio'],['Balanza con temporizador','Accesorio'],['Server / jarra 600 ml','Accesorio'],['Cuchara medidora','Accesorio'],['Taza de cerámica B.R.U','Taza / vaso'],['Vaso térmico','Taza / vaso']];
var S = { marca: null, docs: [], byId: {}, cafes: [], ins: [], eq: [], eqDoc: null, cur: null, vista: 'lista', offline: false, verArch: false, dirty: false, tSave: null };

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function n(v){ var x = Number(v); return isFinite(x) ? x : 0; }
function r100(v){ return Math.round(n(v) / 100) * 100; }
function fmt(v){ var x = Math.round(n(v)), neg = x < 0; return (neg ? '-$' : '$') + Math.abs(x).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
function hoy(){ var d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
function sumaDias(f, k){ var d = new Date(f + 'T12:00:00'); d.setDate(d.getDate() + n(k)); return d.toISOString().slice(0, 10); }
function fFecha(f){ if (!f) return ''; var p = String(f).slice(0, 10).split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
function uid(p){ return p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function lsGet(k, d){ try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function toast(t, err){ var e = $('toast'); e.textContent = t; e.classList.toggle('err', !!err); e.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(function(){ e.classList.remove('on'); }, 2800); }
function copiar(t){ return (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function(){ toast('Copiado'); }).catch(function(){ var a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); toast('Copiado'); }); }

// =============== DATOS ===============
function sb(path, opts){
  opts = opts || {};
  var h = { 'apikey': SB_KEY, 'Content-Type': 'application/json' }; if (opts.prefer) h.Prefer = opts.prefer;
  return fetch(SB_URL + '/rest/v1/' + path, { method: opts.method || 'GET', headers: h, body: opts.body ? JSON.stringify(opts.body) : undefined })
    .then(function(r){ if (!r.ok) return r.text().then(function(t){ throw new Error('Supabase ' + r.status + ': ' + t.slice(0, 140)); }); if (r.status === 204) return null; return r.text().then(function(t){ return t ? JSON.parse(t) : null; }); });
}
function armarCatalogo(store){
  var cat = (store && store.catalogo) || [], fin = (store && store.finanzas) || {};
  var out = [];
  cat.forEach(function(c){
    if (!c || !c.nombre || c.activo === false) return;
    var pres = c.presentaciones || [];
    var img = c.img || (c.fotos && c.fotos[0]) || '';
    var sub = [c.proceso, c.origen, c.notas].filter(Boolean).join(' · ').slice(0, 90);
    if (pres.length) {
      pres.forEach(function(p){
        var precio = n(p.precio) || (n(p.precioIva) ? n(p.precioIva) / (1 + IVA) : 0);
        out.push({ key: c.nombre + '|' + (p.label || ''), nombre: c.nombre, pres: p.label || '', precio: Math.round(precio), costo: Math.round(n(p.costo)), stock: n(c.stock), img: img, sub: sub });
      });
    } else {
      out.push({ key: c.nombre + '|', nombre: c.nombre, pres: c.cantidad ? c.cantidad + 'g' : '', precio: Math.round(n(c.precio)), costo: Math.round(n(c.costo)), stock: n(c.stock), img: img, sub: sub });
    }
  });
  out.sort(function(a, b){ return a.nombre === b.nombre ? a.precio - b.precio : (a.nombre < b.nombre ? -1 : 1); });
  S.cafes = out;
  var tc = (store && store.tienda_config) || {};
  S.marca = { wa: String(tc.wa || WA_BRU).replace(/\D/g, ''), email: tc.email || '', hero: tc.heroBg || '' };
  S.ins = (fin.insumos || []).filter(function(i){ return i && i.nombre; }).map(function(i){ return { key: i.id || i.nombre, nombre: i.nombre, tipo: i.tipo || '', costo: Math.round(n(i.costoUnit)), qty: n(i.qty) }; });
}
function cargar(){
  var bk = lsGet(LS_BK, {});
  return Promise.all([
    sb('bru_store?id=eq.main&select=catalogo,finanzas,tienda_config').catch(function(){ return null; }),
    sb(T + '?tipo=eq.' + TIPO + '&select=id,tipo,fecha,data,created_at&order=created_at.asc').catch(function(){ return null; }),
    sb(T + '?id=eq.kitequipos&select=id,tipo,data').catch(function(){ return null; })
  ]).then(function(r){
    var eqN = r[2] && r[2][0], eqL = lsGet('bru_kitcot_eq', null);
    if (eqN && eqL && String(eqL.data.actualizada || '') > String(eqN.data.actualizada || '')) eqN = eqL;
    S.eqDoc = eqN || eqL || { id: 'kitequipos', tipo: 'kit_cfg', data: { lista: EQ_DEF.map(function(e, i){ return { id: 'eq' + i, nombre: e[0], cat: e[1], costo: 0, precio: 0 }; }) } };
    S.eq = S.eqDoc.data.lista || [];
    if (r[0] && r[0][0]) { armarCatalogo(r[0][0]); lsSet('bru_kitcot_cat', { cafes: S.cafes, ins: S.ins, marca: S.marca }); }
    else { var cc = lsGet('bru_kitcot_cat', null); if (cc) { S.cafes = cc.cafes || []; S.ins = cc.ins || []; S.marca = cc.marca || null; } }
    var nube = r[1];
    S.offline = !nube;
    var mapa = {};
    (nube || []).forEach(function(d){ d.data = d.data || {}; mapa[d.id] = d; });
    // la copia local gana solo si es más reciente (cambios que no alcanzaron a subir)
    Object.keys(bk).forEach(function(id){
      var l = bk[id]; if (!l || !l.data) return;
      if (!mapa[id] || String(l.data.actualizada || '') > String(mapa[id].data.actualizada || '')) { mapa[id] = l; if (nube) subir(l); }
    });
    S.docs = Object.keys(mapa).map(function(k){ return mapa[k]; });
    S.byId = mapa;
  });
}
function respaldoLocal(){ lsSet(LS_BK, S.byId); }
function subir(doc){
  return sb(T + '?on_conflict=id', { method: 'POST', prefer: 'resolution=merge-duplicates,return=minimal', body: [{ id: doc.id, tipo: doc.tipo, fecha: doc.fecha || null, data: doc.data }] });
}
function guardar(doc, silencioso){
  doc.data.actualizada = new Date().toISOString();
  if (!S.byId[doc.id]) { S.docs.push(doc); S.byId[doc.id] = doc; }
  respaldoLocal();
  S.dirty = false; pintarEstadoGuardado('Guardando…');
  return subir(doc).then(function(){ S.offline = false; pintarEstadoGuardado('Guardado ✓'); if (!silencioso) toast('Cotización guardada'); })
    .catch(function(){ S.offline = true; pintarEstadoGuardado('Guardado en este equipo (sin nube)'); if (!silencioso) toast('Sin conexión: quedó guardada en este equipo', true); });
}
function programarGuardado(){
  S.dirty = true; pintarEstadoGuardado('Cambios sin guardar…');
  clearTimeout(S.tSave); S.tSave = setTimeout(function(){ if (S.cur) guardar(S.cur, true); }, 1500);
}
function pintarEstadoGuardado(t){ var e = $('saveSt'); if (e) e.textContent = t; }
function guardarEquipos(){
  S.eqDoc.data.lista = S.eq; S.eqDoc.data.actualizada = new Date().toISOString();
  lsSet('bru_kitcot_eq', S.eqDoc);
  return subir(S.eqDoc).then(function(){ toast('Equipos guardados'); }).catch(function(){ toast('Sin conexión: guardados en este equipo', true); });
}
// Mantiene el consecutivo sin huecos: 1, 2, 3… en orden de creación (las eliminadas no cuentan)
function compactarNumeros(){
  var vivos = S.docs.filter(function(d){ return !d.data.eliminada; }).sort(function(a, b){
    return n(a.data.num) - n(b.data.num) || String(a.data.creada || '').localeCompare(String(b.data.creada || ''));
  });
  var cambios = [];
  vivos.forEach(function(d, i){ if (n(d.data.num) !== i + 1) { d.data.num = i + 1; cambios.push(d); } });
  return Promise.all(cambios.map(function(d){ return guardar(d, true); }));
}
function sigNum(){ var m = 0; S.docs.forEach(function(d){ if (!d.data.eliminada) m = Math.max(m, n(d.data.num)); }); return m + 1; }

// =============== CÁLCULOS ===============
function calcOpcion(o, cant, conIva){
  var costoU = 0, listaU = 0;
  (o.items || []).forEach(function(it){ costoU += n(it.qty) * n(it.costo); listaU += n(it.qty) * n(it.precio); });
  var precioU = n(o.manual) > 0 ? n(o.manual) : r100(listaU * (1 - n(o.dcto) / 100));
  var c = Math.max(1, Math.round(n(cant)) || 1);
  var sub = precioU * c, iva = conIva ? Math.round(sub * IVA) : 0;
  var util = precioU - costoU, mg = precioU > 0 ? util / precioU * 100 : 0;
  return { costoU: costoU, listaU: listaU, precioU: precioU, precioUIva: conIva ? Math.round(precioU * (1 + IVA)) : precioU, cant: c, sub: sub, iva: iva, total: sub + iva, util: util, utilTot: util * c, mg: mg, sinCosto: (o.items || []).some(function(it){ return n(it.qty) > 0 && !n(it.costo); }) };
}
function precioConUtilidad(costo, mg){ return n(costo) > 0 && n(mg) > 0 && n(mg) < 95 ? r100(n(costo) / (1 - n(mg) / 100)) : null; }
function aplicarUtilidad(o){ (o.items || []).forEach(function(it){ var p = precioConUtilidad(it.costo, o.mg); if (p != null) it.precio = p; }); }
function mgClase(m){ return m >= 35 ? 'mg-ok' : m >= 20 ? 'mg-warn' : 'mg-bad'; }

// =============== MODELO ===============
function itemCafe(c, qty){ return { tipo: 'cafe', ref: c.key, desc: c.nombre + (c.pres ? ' · ' + c.pres : ''), qty: qty || 1, costo: c.costo, precio: c.precio, img: c.img || '' }; }
function itemIns(i, qty){ return { tipo: 'insumo', ref: i.key, desc: i.nombre, qty: qty || 1, costo: i.costo, precio: r100(i.costo * 1.3) }; }
function itemEq(e, qty){ return { tipo: 'equipo', ref: e.id, desc: e.nombre, qty: qty || 1, costo: n(e.costo), precio: n(e.precio) }; }
function nuevaCot(){
  var f = hoy();
  return { id: uid('kc'), tipo: TIPO, fecha: f, data: {
    num: sigNum(), cliente: '', empresa: '', nit: '', tel: '', email: '', ciudad: '',
    cantidad: 1, vigencia: 15, iva: true, estado: 'Borrador', elegida: null, archivada: false,
    notas: '', condiciones: 'Precios por kit. Tiempo de entrega: 5 a 8 días hábiles después de confirmar el pedido y el anticipo del 50%. Café tostado sobre pedido. Envío no incluido salvo que se indique.',
    opciones: [0, 1, 2].map(function(k){ return { nombre: 'Kit ' + TIERS[k], desc: '', items: [], dcto: 0, manual: 0 }; }),
    creada: new Date().toISOString()
  } };
}
function autollenar(cot){
  var cafes = S.cafes.filter(function(c){ return c.precio > 0 && !/drip/i.test(c.nombre + ' ' + c.pres); }).slice().sort(function(a, b){ return a.precio - b.precio; });
  if (!cafes.length) cafes = S.cafes.filter(function(c){ return c.precio > 0; }).sort(function(a, b){ return a.precio - b.precio; });
  if (!cafes.length) { toast('No hay cafés con precio en el catálogo', true); return; }
  var empaque = S.ins.filter(function(i){ return /caja|kit|empaque|estuche|bolsa/i.test(i.nombre); })[0];
  var drip = S.cafes.filter(function(c){ return /drip/i.test(c.nombre + ' ' + c.pres); })[0];
  var distintos = function(lista, k){ var vistos = {}, out = []; lista.forEach(function(c){ if (out.length < k && !vistos[c.nombre]) { vistos[c.nombre] = 1; out.push(c); } }); return out; };
  var mid = cafes.slice(Math.floor(cafes.length / 3));
  var top = cafes.slice().reverse();
  var o = cot.data.opciones;
  o[0].items = [itemCafe(cafes[0])];
  o[0].desc = 'Un café de especialidad, ideal como detalle.';
  o[1].items = distintos(mid, 2).map(function(c){ return itemCafe(c); });
  o[1].desc = 'Dos cafés para comparar orígenes o perfiles.';

  if (mol.length) o[2].items.push(itemEq(mol[0]));
