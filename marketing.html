<style>
:root{
  --bg:#0d0b09;--bg2:#141210;--bg3:#1c1916;--card:#181512;--card2:#1e1b17;
  --gold:#c9a84c;--gold2:#e8c96a;--gold3:rgba(201,168,76,.12);
  --txt:#e8e2d8;--mut:#a8a098;--dim:#6a6058;
  --line:rgba(255,255,255,.08);--line2:rgba(201,168,76,.28);
  --ok:#5fd394;--ok-bg:rgba(95,211,148,.1);--bad:#f38b8b;--bad-bg:rgba(243,139,139,.1);--warn:#f3a96b;--warn-bg:rgba(243,169,107,.1);--info:#7fb2f0;--info-bg:rgba(127,178,240,.1);
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
select,option{background:var(--card2);color:var(--txt)}
a{color:var(--gold)}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:300;margin:0}
.wrap{max-width:1320px;margin:0 auto;padding:18px 16px 80px}
html.embed .wrap{padding:12px 12px 60px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.top h1{font-size:28px}
html.embed .top h1{display:none}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--mut);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:rgba(95,211,148,.35)}.pill.warn{color:var(--warn);border-color:rgba(243,169,107,.35)}.pill.bad{color:var(--bad);border-color:rgba(243,139,139,.35)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:thin}
.tabs button{border:1px solid var(--line);background:transparent;padding:7px 13px;border-radius:999px;cursor:pointer;color:var(--mut);white-space:nowrap;font-size:13px}
.tabs button.on{background:var(--gold);color:#1a1406;border-color:var(--gold);font-weight:600}
.tabs .cnt{font-size:11px;margin-left:4px;opacity:.85}
.subtabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.subtabs button{border:none;background:var(--card2);padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--mut);font-size:13px}
.subtabs button.on{background:var(--gold3);color:var(--gold2);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card h3{font-size:19px;margin-bottom:10px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:860px){.g2,.g3,.g4{grid-template-columns:1fr}}
.grid>*{min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
label.f.chk{flex-direction:row;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:13px;color:var(--txt)}
input[type=text],input[type=number],input[type=date],input[type=month],input[type=email],input[type=search],input[type=password],select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none;text-transform:none;letter-spacing:0}
input:focus,select:focus,textarea:focus{border-color:var(--line2)}
textarea{min-height:90px;resize:vertical}
.btn{border:1px solid var(--line2);background:var(--card2);padding:8px 14px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:13px}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:var(--gold);color:#1a1406;border-color:var(--gold);font-weight:600}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ghost{background:transparent}
.btn.dang{color:var(--bad);border-color:rgba(243,139,139,.35)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--mut)}.dim{color:var(--dim)}.small{font-size:12px}.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;min-width:0}
.kpi b{display:block;font-family:Fraunces,serif;font-weight:300;font-size:22px;line-height:1.15;overflow-wrap:anywhere}
.kpi span{font-size:12px;color:var(--mut)}
.kpi.ok b{color:var(--ok)}.kpi.bad b{color:var(--bad)}.kpi.warn b{color:var(--warn)}
.tbl-w{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:600;background:var(--bg2);position:sticky;top:0}
table.t tr.tot td{font-weight:600;border-top:1px solid var(--line2)}
table.t tr.grp td{background:var(--bg2);font-weight:600;color:var(--gold2)}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:rgba(255,255,255,.02)}
table.t tr.anul td{opacity:.45;text-decoration:line-through}
table.t td.num,table.t th.num{text-align:right}
.st{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--card2);color:var(--mut);white-space:nowrap}
.st.ok{color:var(--ok);background:var(--ok-bg)}.st.warn{color:var(--warn);background:var(--warn-bg)}.st.bad{color:var(--bad);background:var(--bad-bg)}.st.info{color:var(--info);background:var(--info-bg)}
.banner{border-radius:var(--r);padding:10px 13px;margin-bottom:10px;font-size:13px;border:1px solid}
.banner.warn{background:var(--warn-bg);border-color:rgba(243,169,107,.35)}
.banner.info{background:var(--info-bg);border-color:rgba(127,178,240,.35)}
.banner.bad{background:var(--bad-bg);border-color:rgba(243,139,139,.35)}
.banner.ok{background:var(--ok-bg);border-color:rgba(95,211,148,.35)}
.banner code{background:rgba(0,0,0,.3);padding:1px 5px;border-radius:4px;font-size:12px}
.sec{margin:16px 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim)}
.empty{padding:34px 16px;text-align:center;color:var(--mut)}
.hide{display:none!important}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:none}
.ov.on{display:block}
.drawer{position:fixed;top:0;right:0;height:100dvh;width:min(760px,100vw);background:var(--bg2);border-left:1px solid var(--line);z-index:41;transform:translateX(105%);visibility:hidden;transition:transform .22s,visibility 0s .22s;display:flex;flex-direction:column}
.drawer.on{transform:none;visibility:visible;transition:transform .22s}
.drawer .hd{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.drawer .hd h2{font-size:22px;flex:1}
.drawer .bd{padding:14px 16px;overflow:auto;flex:1}
.drawer .ft{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lines td{padding:4px 4px}
.lines input,.lines select{padding:6px 7px;font-size:13px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--gold);color:#1a1406;padding:9px 16px;border-radius:999px;font-weight:600;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;max-width:92vw;text-align:center}
.toast.on{opacity:1}
.toast.err{background:var(--bad)}
.bar{height:8px;background:var(--card2);border-radius:4px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--gold);border-radius:0 4px 4px 0}
.drop{border:1.5px dashed var(--line2);border-radius:var(--r);padding:26px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--card);transition:background .15s,border-color .15s}
.drop.on{background:var(--gold3);border-color:var(--gold)}
.ag-fab{position:fixed;right:16px;bottom:16px;z-index:30;background:var(--gold);color:#1a1406;border:none;border-radius:999px;padding:11px 16px;font-weight:600;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.45);display:flex;gap:6px;align-items:center}
.ag{position:fixed;top:0;right:0;height:100dvh;width:min(460px,100vw);background:var(--bg2);border-left:1px solid var(--line2);z-index:44;transform:translateX(105%);visibility:hidden;transition:transform .22s,visibility 0s .22s;display:flex;flex-direction:column}
.ag.on{transform:none;visibility:visible;transition:transform .22s}
.ag.on~.ag-fab,body:has(.ag.on) .ag-fab{display:none}
.ag .hd{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.ag .hd h2{font-size:20px;flex:1}
.ag-msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.ag-in{padding:10px 12px;border-top:1px solid var(--line)}
.ag-u{align-self:flex-end;background:var(--gold3);border:1px solid var(--line2);padding:8px 11px;border-radius:12px 12px 2px 12px;max-width:88%;overflow-wrap:anywhere}
.ag-a{align-self:flex-start;background:var(--card);border:1px solid var(--line);padding:8px 11px;border-radius:12px 12px 12px 2px;max-width:92%;overflow-wrap:anywhere}
.ag-a code,.ag-u code{background:rgba(0,0,0,.3);padding:0 4px;border-radius:4px}
.ag-tool{font-size:12px;color:var(--mut);padding:6px 10px;border-left:2px solid var(--line2);overflow-wrap:anywhere}
.ag-tool.ok{border-color:var(--ok)}.ag-tool.err{border-color:var(--bad);color:var(--bad)}.ag-tool.no{border-color:var(--dim)}
.ag-ok{background:var(--warn-bg);border:1px solid rgba(243,169,107,.35);border-radius:10px;padding:10px 12px;font-size:13px}
.ag-hola{color:var(--mut);line-height:1.6}
.ag-sug{display:block;margin-top:6px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;text-align:left;width:100%;color:var(--txt)}
.ag-sug:hover{border-color:var(--gold)}
@media(max-width:600px){.ag-fab span{display:none}}
@media print{.ag,.ag-fab{display:none!important}}
.cal-day{display:flex;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.cal-day .d{width:58px;font-variant-numeric:tabular-nums;color:var(--mut);font-size:12px}
@media print{body{background:#fff;color:#000}.tabs,.top,.no-print{display:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>Marketing</h1><span class="sp"></span><span class="pill">✨ Agente con tus ventas reales</span></div>
  <div class="tabs" id="tabs"></div>
  <div id="main"></div>
</div>
<div class="ov" id="ov"></div>
<aside class="drawer" id="dr"></aside>
<div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
// =============== B.R.U · MARKETING ===============
// Lee ventas, catálogo y clientes de bru_store (solo lectura) y guarda su trabajo en bru_conta (tipos mkt_*).
var SB_URL = 'https://dzgtyazvqpdmwvwqpvco.supabase.co';
var SB_KEY = 'sb_publishable_oWYjmVo0OBg5XbV4BDaSWQ_hOWH6czB';
var T = 'bru_conta', API = '/api/conta';
var S = { tab: 'resumen', docs: [], byId: {}, store: null, cfg: null, gastoPub: [], ag: { msgs: [], vista: [], ocupado: false, auto: true, adj: [] }, sub: {} };
var DEF = { marca: { nombre: 'B.R.U · Brew Respect Unite', instagram: '@BruCoffeeRoasters_', whatsapp: '573044927790', web: 'brucoffeeshop.online',
  propuesta: 'Café de especialidad colombiano de productores con historia y cafés de competencia, tostado fresco y entregado en todo Colombia.',
  publico: 'Personas de 22 a 45 años en Bogotá y Colombia que preparan café en casa (V60, prensa, espresso, moka), regalan café y buscan productos con historia.',
  tono: 'Cercano, experto sin ser elitista, orgulloso del origen colombiano. Frases cortas.', hashtags: '#cafedeespecialidad #cafecolombiano #specialtycoffee #BRUcoffee #huila',
  diferenciales: 'Cafés de productores premiados (Chocomora: café de campeonato de barismo), trazabilidad de finca, tostión propia, atención directa por WhatsApp.' },
  meta: 3000000, presupuesto: 300000 };

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function r0(n){ return Math.round(Number(n) || 0); }
function fmt(n){ var v = Number(n) || 0; var neg = v < 0; var s = Math.abs(Math.round(v)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.'); return (neg ? '-$' : '$') + s; }
function hoy(){ var d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
function sumaDias(f, n){ var d = new Date(f + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }
function dias(a, b){ return Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5); }
function fFecha(f){ if (!f) return ''; var p = String(f).slice(0, 10).split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var DSEM = ['dom','lun','mar','mié','jue','vie','sáb'];
function nomMes(ym){ var p = ym.split('-'); return MESES[Number(p[1]) - 1] + ' ' + p[0]; }
function norm(s){ return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim(); }
function uid(p){ return p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function lsGet(k, d){ try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function toast(t, err){ var e = $('toast'); e.textContent = t; e.classList.toggle('err', !!err); e.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(function(){ e.classList.remove('on'); }, 3000); }
function val(id){ var e = $(id); return e ? (e.type === 'checkbox' ? e.checked : e.value) : ''; }
function fld(lbl, html){ return '<label class="f">' + esc(lbl) + html + '</label>'; }
function inp(id, v, tipo, extra){ return '<input type="' + (tipo || 'text') + '" id="' + id + '" value="' + esc(v == null ? '' : v) + '"' + (extra || '') + '>'; }
function txa(id, v, extra){ return '<textarea id="' + id + '"' + (extra || '') + '>' + esc(v || '') + '</textarea>'; }
function sel(id, op, v){ return '<select id="' + id + '">' + op.map(function(o){ var k = Array.isArray(o) ? o[0] : o, n = Array.isArray(o) ? o[1] : o; return '<option value="' + esc(k) + '"' + (String(k) === String(v) ? ' selected' : '') + '>' + esc(n) + '</option>'; }).join('') + '</select>'; }
function abrirPanel(titulo, cuerpo, pie){
  $('dr').innerHTML = '<div class="hd"><h2>' + esc(titulo) + '</h2><button class="btn sm ghost" id="drX">✕</button></div><div class="bd">' + cuerpo + '</div><div class="ft">' + (pie || '') + '</div>';
  $('dr').classList.add('on'); $('ov').classList.add('on'); $('drX').onclick = cerrarPanel;
}
function cerrarPanel(){ $('dr').classList.remove('on'); $('ov').classList.remove('on'); }
function copiar(t){ return (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function(){ toast('Copiado'); }).catch(function(){ var a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); toast('Copiado'); }); }

// =============== DATOS ===============
function sb(path, opts){
  opts = opts || {};
  var h = { 'apikey': SB_KEY, 'Content-Type': 'application/json' }; if (opts.prefer) h.Prefer = opts.prefer;
  return fetch(SB_URL + '/rest/v1/' + path, { method: opts.method || 'GET', headers: h, body: opts.body ? JSON.stringify(opts.body) : undefined })
    .then(function(r){ if (!r.ok) return r.text().then(function(t){ throw new Error('Supabase ' + r.status + ': ' + t.slice(0, 140)); }); if (r.status === 204) return null; return r.text().then(function(t){ return t ? JSON.parse(t) : null; }); });
}
function api(accion, datos){
  return fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ accion: accion, datos: datos || {} }) })
    .then(function(r){ return r.text().then(function(t){ var j; try { j = JSON.parse(t); } catch (e) { j = { error: 'Respuesta inválida del servidor (' + r.status + ')' }; } return j; }); })
    .catch(function(){ return { error: 'No hay conexión con el servidor' }; });
}
function cargar(){
  return Promise.all([
    sb('bru_store?id=eq.main&select=catalogo,inventario,finanzas'),
    sb(T + '?tipo=in.(mkt_cfg,mkt_post,mkt_camp,mkt_idea)&select=id,tipo,fecha,data,created_at&order=created_at.asc'),
    sb(T + '?tipo=eq.asiento&select=fecha,data').catch(function(){ return []; })
  ]).then(function(r){
    S.store = (r[0] && r[0][0]) || {};
    S.docs = r[1] || []; S.byId = {}; S.docs.forEach(function(d){ d.data = d.data || {}; S.byId[d.id] = d; });
    var c = S.byId.mktcfg ? S.byId.mktcfg.data : {};
    S.cfg = JSON.parse(JSON.stringify(DEF)); Object.keys(c).forEach(function(k){ if (k === 'marca') { for (var j in c.marca) S.cfg.marca[j] = c.marca[j]; } else S.cfg[k] = c[k]; });
    // inversión en publicidad registrada en contabilidad (cuenta 523560)
    S.gastoPub = [];
    (r[2] || []).forEach(function(a){ if (!a.data || a.data.anulado) return; (a.data.lineas || []).forEach(function(l){ if (String(l.c).indexOf('523560') === 0) S.gastoPub.push({fecha: a.fecha, valor: (Number(l.d) || 0) - (Number(l.h) || 0), desc: a.data.desc}); }); });
  });
}
function guardar(doc){
  doc.data = doc.data || {};
  if (!S.byId[doc.id]) { S.docs.push(doc); S.byId[doc.id] = doc; }
  return sb(T + '?on_conflict=id', { method: 'POST', prefer: 'resolution=merge-duplicates,return=minimal', body: [{ id: doc.id, tipo: doc.tipo, fecha: doc.fecha || null, data: doc.data }] }).then(function(){ return doc; });
}
function borrar(id){ var d = S.byId[id]; if (!d) return Promise.resolve(); S.docs = S.docs.filter(function(x){ return x.id !== id; }); delete S.byId[id]; return sb(T + '?id=eq.' + encodeURIComponent(id), { method: 'DELETE' }); }
function guardarCfg(){ return guardar({ id: 'mktcfg', tipo: 'mkt_cfg', data: S.cfg }); }
function lista(t){ return S.docs.filter(function(d){ return d.tipo === t; }); }

// =============== ANÁLISIS DE VENTAS ===============
function ventas(){
  var f = (S.store && S.store.finanzas) || {}, out = [];
  (f.venExt || []).forEach(function(v){ var fe = String(v.date || v.fecha || '').slice(0, 10); if (!fe) return; out.push({fecha: fe, prod: v.prod || '', qty: Number(v.qty) || 1, total: Number(v.bruto) || (Number(v.qty) || 1) * (Number(v.precio) || 0), cliente: v.cliente || '', vendedor: v.vendedor || '', canal: v.pago || 'Directa', origen: 'externa'}); });
  (f.ven || []).forEach(function(v){ var fe = String(v.date || v.fecha || '').slice(0, 10); if (!fe) return; out.push({fecha: fe, prod: v.prod || '', qty: Number(v.qty) || 1, total: Number(v.total) || (Number(v.qty) || 1) * (Number(v.precio) || 0), cliente: v.cliente || '', vendedor: v.vendedor || '', canal: v.canal || 'Tienda', origen: 'tienda'}); });
  return out.filter(function(v){ return v.total > 0; }).sort(function(a, b){ return a.fecha < b.fecha ? -1 : 1; });
}
function productos(){
  return ((S.store && S.store.catalogo) || []).filter(function(c){ return c && c.nombre; }).map(function(c){
    var base = Number(c.precio) || 0; return {nombre: c.nombre, precio: Math.round(base * 1.19 / 100) * 100, precio_sin_iva: base, presentacion: c.presLabel || ((c.cantidad || '') + 'g'), stock: Number(c.stock) || 0, notas: c.notas || '', origen: c.origen || '', productor: c.productor || '', variedad: c.variedad || '', proceso: c.proceso || '', categoria: c.categoria || '', altitud: c.altitud || '', precioEU: c.precios && c.precios.EU || null, foto: c.img || '', descripcion: String(c.desc || '').slice(0, 500), activo: c.activo !== false};
  });

function clientes(){

    var usos = r.content.filter(function(c){ return c.type === 'tool_use'; });
    if (r.stop_reason === 'max_tokens' && !usos.length) { S.ag.msgs.push({role: 'user', content: [{type: 'text', text: 'Tu respuesta se cortó. Continúa desde donde ibas.'}]}); return agCiclo(n + 1); }
    if (r.stop_reason !== 'tool_use' || !usos.length) return;
    var res = [], k = 0;
    function sig(){ if (k >= usos.length) { S.ag.msgs.push({role: 'user', content: res}); return agCiclo(n + 1); } var u = usos[k++]; return agEjecutar(u).then(function(out){ res.push({type: 'tool_result', tool_use_id: u.id, content: JSON.stringify(out).slice(0, 30000), is_error: !!(out && out.ok === false)}); }).then(sig); }
    return sig();
  });
}
function agEjecutar(u){
  var fn = AG_TOOLS[u.name], inp = u.input || {};
  if (!fn) return Promise.resolve({ok: false, error: 'Herramienta desconocida'});
  var escribe = AG_ESCRIBE[u.name], paso = {t: escribe && !S.ag.auto ? 'aprobar' : 'tool', html: escribe ? agDescribir(u.name, inp) : 'Consultando: ' + esc(u.name.replace(/_/g, ' '))};
  S.ag.vista.push(paso); agPintar();
  var permiso = paso.t === 'aprobar' ? new Promise(function(ok){ paso.cb = ok; }) : Promise.resolve(true);
  return permiso.then(function(si){
    paso.t = 'tool'; delete paso.cb;
    if (!si) { paso.estado = 'no'; paso.res = 'Rechazado'; agPintar(); return {ok: false, error: 'El usuario rechazó esta acción. Pregúntale qué cambiar.'}; }
    return Promise.resolve().then(function(){ return fn(inp); }).then(function(out){ paso.estado = out && out.ok === false ? 'err' : 'ok'; if (out && out.guardadas != null) paso.res = out.guardadas + ' guardadas'; if (out && out.ok === false) paso.res = out.error; agPintar(); return out == null ? {ok: true} : out; })
      .catch(function(e){ paso.estado = 'err'; paso.res = e.message; agPintar(); return {ok: false, error: e.message}; });
  });
}
